[project]
name = "ta-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikita Lenyk", email = "nikitalenyk2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "fastmcp>=4.1.0",
    "mcp>=2.3.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.1",
]

[project.scripts]
ta-mcp = "ta_mcp:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mdformat>=1.0.0",
    "pre-commit>=4.7.0",
    "ty>=0.0.87",
]
