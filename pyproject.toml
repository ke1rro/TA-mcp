[project]
name = "ta-mcp"
version = "0.1.0"
description = "Evidence-backed lab reviews through two agents and scoped MCP tools"
readme = "README.md"
authors = [
    { name = "Nikita Lenyk", email = "nikitalenyk2@gmail.com" },
    { name = "Andrii Kryvyi", email = "kryvyi.pn@ucu.edu.ua" },
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.0",
    "mcp[cli]>=2.3.0",
    "openai-agents>=0.24.0",
    "weave>=0.53.12",
]

[project.scripts]
ta-agent = "ta_agent.cli:main"
ta-mcp = "ta_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mdformat>=1.0.0",
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "ty>=0.0.87",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
